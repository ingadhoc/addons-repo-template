name: pre-commit

on:
  push:
    branches:
      - "1[8-9].0"
      - "[2-9][0-9].0"
  pull_request:
    branches:
      - "1[8-9].0*"
      - "[2-9][0-9].0*"
  pull_request_target:
    branches:
      - "1[8-9].0*"
      - "[2-9][0-9].0*"

jobs:
  pre-commit:
    # Solo corre en push y pull_request (contexto sin privilegios)
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      -
        id: setup-python
        name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
          cache: "pip"
      -
        name: Pre-commit cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ steps.setup-python.outputs.python-version }}|${{ hashFiles('.pre-commit-config.yaml') }}
      -
        id: precommit
        name: Pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  report-status:
    # Solo corre en pull_request_target para crear el commit status
    # NO hace checkout — no ejecuta código del PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      -
        name: Wait for pre-commit check
        uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325  # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Esperar hasta 5 minutos a que el check de pull_request termine
            let state = 'pending';
            for (let i = 0; i < 30; i++) {
              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: sha, check_name: 'pre-commit'
              });
              const run = checks.data.check_runs.find(r => r.name === 'pre-commit');
              if (run && run.status === 'completed') {
                state = run.conclusion === 'success' ? 'success' : 'failure';
                break;
              }
              await new Promise(r => setTimeout(r, 10000)); // esperar 10s
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state,
              context: 'mergebot/pre-commit'
            });
